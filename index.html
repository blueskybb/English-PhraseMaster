const menuScreen = document.getElementById('menuScreen');
const studyScreen = document.getElementById('studyScreen');
const normalAccordionContainer = document.getElementById('normalAccordionContainer');
const genreButtonContainer = document.getElementById('genreButtonContainer');
const dynamicLevelContainers = document.getElementById('dynamicLevelContainers');
const japaneseEl = document.getElementById('japaneseText');
const englishEl = document.getElementById('englishText');
const counterEl = document.getElementById('counter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const prevGroupBtn = document.getElementById('prevGroupBtn');
const resetGroupBtn = document.getElementById('resetGroupBtn');
const nextGroupBtn = document.getElementById('nextGroupBtn');
const toggleBtn = document.getElementById('toggleBtn');
const toggleJaBtn = document.getElementById('toggleJaBtn');
const alwaysShowBtn = document.getElementById('alwaysShowBtn');
const dimmedBtn = document.getElementById('dimmedBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const pauseBtn = document.getElementById('pauseBtn');
const autoPlayBtn = document.getElementById('autoPlayBtn');
const loopBtn = document.getElementById('loopBtn');
const pauseRatioSelect = document.getElementById('pauseRatioSelect');
const jaPauseRatioSelect = document.getElementById('jaPauseRatioSelect');
const muteBtn = document.getElementById('muteBtn');
const speechBtn = document.getElementById('speechBtn');
const speedBtns = document.querySelectorAll('.btn-speed');
const backToMenuBtn = document.getElementById('backToMenu');
const tagFilterInput = document.getElementById('tagFilterInput');
const tagInputField = document.getElementById('tagInputField');
const levelRadioContainer = document.getElementById('levelRadioContainer');
const fullscreenBtnMenu = document.getElementById('fullscreenBtnMenu');
const fullscreenBtnStudy = document.getElementById('fullscreenBtnStudy');
const fileInput = document.getElementById('fileInput');
const exportBtn = document.getElementById('exportBtn');

window.onload = init;

function parseTextToData(text) {
    const lines = text.split(/\r?\n/);
    const parsed = [];
    let idCounter = 1;
    lines.forEach(line => {
        line = line.trim();
        if (!line) return;
        const parts = line.split('◆').map(p => p.trim());
        const ja = parts[0] || "";
        const en = parts[1] || "";
        const level = parts[2] || "0";
        const tags = parts[3] || "";
        if (ja) {
            parsed.push({ id: idCounter++, ja, en, level, tags });
        }
    });
    return parsed;
}

function init() {
    initLevelUI();
    const defaultParsed = parseTextToData(SAMPLE_TEXT);
    const saved = localStorage.getItem('eikaiwaAllData');
    if (saved) {
        try {
            allData = JSON.parse(saved);
            allData.forEach(d => { if (d.tags === undefined) d.tags = ""; });
        } catch(e) {
            allData = defaultParsed;
        }
    } else {
        allData = defaultParsed;
    }
    saveAllData();
    renderAllMenus();
    switchScreen('menu');

    tagFilterInput.addEventListener('input', (e) => {
        tagFilter = e.target.value.trim();
        renderAllMenus();
    });

    tagInputField.addEventListener('input', (e) => {
        if (currentGroup.length > 0) {
            const item = currentGroup[currentIndex];
            item.tags = e.target.value;
            const target = allData.find(d => d.id === item.id);
            if (target) target.tags = item.tags;
            saveAllData();
            renderAllMenus();
        }
    });

    fileInput.addEventListener('change', handleFileSelect);
    exportBtn.addEventListener('click', exportData);

    fullscreenBtnMenu.addEventListener('click', toggleFullScreen);
    fullscreenBtnStudy.addEventListener('click', toggleFullScreen);

    prevBtn.addEventListener('click', () => {
        stopAutoPlay();
        if (currentIndex > 0) {
            currentIndex--;
            updateDisplay();
        }
    });

    nextBtn.addEventListener('click', () => {
        stopAutoPlay();
        if (!isEnglishVisible && !isAlwaysShow) {
            isEnglishVisible = true;
            englishEl.classList.remove('hidden');
            if (!isMuted) speakText(currentGroup[currentIndex].en, 'en-US');
        } else {
            if (currentIndex < currentGroup.length - 1) {
                currentIndex++;
                updateDisplay();
                if (isAlwaysShow && !isMuted) speakText(currentGroup[currentIndex].en, 'en-US');
            } else {
                handleLoopAdvance();
            }
        }
    });

    document.addEventListener('keydown', (e) => {
        if (!studyScreen.classList.contains('active')) return;
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
        if (e.key === 'ArrowLeft') {
            e.preventDefault();
            prevBtn.click();
        } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            nextBtn.click();
        }
    });

    prevGroupBtn.addEventListener('click', () => {
        stopAutoPlay();
        const newStart = Math.max(0, currentStartIdx - SMALL_GROUP_SIZE);
        startStudy(currentSourceData, newStart, newStart + SMALL_GROUP_SIZE);
    });

    resetGroupBtn.addEventListener('click', () => {
        stopAutoPlay();
        currentIndex = 0;
        updateDisplay();
        if (isAlwaysShow && !isMuted) speakText(currentGroup[currentIndex].en, 'en-US');
    });

    nextGroupBtn.addEventListener('click', () => {
        stopAutoPlay();
        const newStart = currentEndIdx;
        if (newStart < currentSourceData.length) {
            startStudy(currentSourceData, newStart, Math.min(currentSourceData.length, newStart + SMALL_GROUP_SIZE));
        }
    });

    toggleBtn.addEventListener('click', () => {
        isEnglishVisible = !isEnglishVisible;
        englishEl.classList.toggle('hidden', !isEnglishVisible);
    });

    toggleJaBtn.addEventListener('click', () => {
        isJapaneseVisible = !isJapaneseVisible;
        japaneseEl.classList.toggle('hidden-lang', !isJapaneseVisible);
    });

    alwaysShowBtn.addEventListener('click', () => {
        isAlwaysShow = !isAlwaysShow;
        alwaysShowBtn.textContent = isAlwaysShow ? "常に英語: ON" : "常に英語: OFF";
        alwaysShowBtn.classList.toggle('active', isAlwaysShow);
        updateDisplay();
    });

    dimmedBtn.addEventListener('click', () => {
        isDimmed = !isDimmed;
        dimmedBtn.textContent = isDimmed ? "英文:薄く" : "英文:標準";
        dimmedBtn.classList.toggle('active', isDimmed);
        englishEl.classList.toggle('dimmed', isDimmed);
    });

    shuffleBtn.addEventListener('click', () => {
        stopAutoPlay();
        isShuffleMode = !isShuffleMode;
        shuffleBtn.textContent = isShuffleMode ? "ランダム" : "番号順";
        shuffleBtn.classList.toggle('active', isShuffleMode);
        if (isShuffleMode) shuffleCurrentGroup();
        else currentGroup = [...originalGroup];
        currentIndex = 0;
        updateDisplay();
        if (isAlwaysShow && !isMuted) speakText(currentGroup[currentIndex].en, 'en-US');
    });

    pauseBtn.addEventListener('click', togglePause);

    autoPlayBtn.addEventListener('click', () => {
        autoPlayMode = (autoPlayMode + 1) % 3;
        const labels = ["自動送り: OFF", "自動送り:英語のみ", "自動送り:日+英"];
        autoPlayBtn.textContent = labels[autoPlayMode];
        autoPlayBtn.classList.toggle('active', autoPlayMode !== 0);
        if (autoPlayMode === 0) {
            pauseBtn.disabled = true;
            if (isPaused) togglePause();
            stopAutoPlay();
        } else {
            pauseBtn.disabled = false;
            startAutoPlaySequence();
        }
    });

    loopBtn.addEventListener('click', () => {
        loopMode = (loopMode + 1) % 3;
        const labels = ["ループ: グループ内", "ループ: 全体", "ループ: OFF"];
        loopBtn.textContent = labels[loopMode];
    });

    muteBtn.addEventListener('click', () => {
        isMuted = !isMuted;
        muteBtn.textContent = isMuted ? "音声: OFF" : "音声: ON";
        muteBtn.style.background = isMuted ? "linear-gradient(to bottom, #e74c3c, #c0392b)" : "linear-gradient(to bottom, #2ecc71, #27ae60)";
        if (isMuted && 'speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
    });

    speechBtn.addEventListener('click', () => {
        if (currentGroup[currentIndex]) speakText(currentGroup[currentIndex].en, 'en-US');
    });

    speedBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            speedBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            speechRate = parseFloat(btn.dataset.speed);
        });
    });

    backToMenuBtn.addEventListener('click', () => {
        stopAutoPlay();
        renderAllMenus();
        switchScreen('menu');
    });
}

function saveAllData() {
    localStorage.setItem('eikaiwaAllData', JSON.stringify(allData));
}

function switchScreen(screenName) {
    if (screenName === 'menu') {
        menuScreen.classList.add('active');
        studyScreen.classList.remove('active');
    } else {
        menuScreen.classList.remove('active');
        studyScreen.classList.add('active');
    }
}

function getFilteredData() {
    if (!tagFilter) return allData;
    const filterLower = tagFilter.toLowerCase();
    return allData.filter(item => item.tags && item.tags.toLowerCase().includes(filterLower));
}

function renderAllMenus() {
    const dataToUse = getFilteredData();
    renderNormalAccordion(dataToUse);
    renderGenreButtons(dataToUse);
    renderDynamicLevels(dataToUse);
}

function renderNormalAccordion(data) {
    normalAccordionContainer.innerHTML = '';
    const totalItems = data.length;
    if (totalItems === 0) {
        normalAccordionContainer.innerHTML = '<p style="font-size:0.9rem; color:#7f8c8d;">該当するデータがありません</p>';
        return;
    }

    const largeGroupCount = Math.ceil(totalItems / LARGE_GROUP_SIZE);
    for (let i = 0; i < largeGroupCount; i++) {
        const lStart = i * LARGE_GROUP_SIZE;
        const lEnd = Math.min(totalItems, (i + 1) * LARGE_GROUP_SIZE);
        
        const itemEl = document.createElement('div');
        itemEl.className = 'accordion-item';
        
        const headerBtn = document.createElement('button');
        headerBtn.className = 'accordion-header';
        headerBtn.innerHTML = `<span>${lStart + 1}～${lEnd}</span><span>▼</span>`;
        
        const bodyEl = document.createElement('div');
        bodyEl.className = 'accordion-body';
        
        const listEl = document.createElement('div');
        listEl.className = 'small-group-list';
        
        const smallGroupCount = Math.ceil((lEnd - lStart) / SMALL_GROUP_SIZE);
        for (let j = 0; j < smallGroupCount; j++) {
            const sStart = lStart + j * SMALL_GROUP_SIZE;
            const sEnd = Math.min(lEnd, sStart + SMALL_GROUP_SIZE);
            
            const btn = document.createElement('button');
            btn.className = 'group-btn';
            btn.textContent = `${sStart + 1}～${sEnd}`;
            btn.addEventListener('click', () => {
                startStudy(data, sStart, sEnd);
            });
            listEl.appendChild(btn);
        }
        
        bodyEl.appendChild(listEl);
        headerBtn.addEventListener('click', () => {
            const isOpen = bodyEl.classList.contains('open');
            document.querySelectorAll('#normalAccordionContainer .accordion-body').forEach(b => b.classList.remove('open'));
            if (!isOpen) bodyEl.classList.add('open');
        });
        
        itemEl.appendChild(headerBtn);
        itemEl.appendChild(bodyEl);
        normalAccordionContainer.appendChild(itemEl);
    }
}

function renderGenreButtons(data) {
    genreButtonContainer.innerHTML = '';
    const genres = new Set();
    allData.forEach(item => {
        if (item.tags) {
            const tags = item.tags.split(/\s+/);
            tags.forEach(t => {
                if (t.trim()) genres.add(t.trim());
            });
        }
    });

    genres.forEach(genre => {
        const btn = document.createElement('button');
        btn.className = 'group-btn';
        btn.style.width = 'auto';
        btn.style.padding = '0.5rem 0.8rem';
        
        // ジャンル（タグ）に含まれる全データ件数をカウント
        const count = allData.filter(item => {
            if (!item.tags) return false;
            const tags = item.tags.split(/\s+/);
            return tags.includes(genre);
        }).length;

        // 指定の通り「ジャンル名(件数)」の形式で表示
        btn.textContent = `${genre}(${count})`;
        
        btn.addEventListener('click', () => {
            const filtered = allData.filter(item => {
                if (!item.tags) return false;
                const tags = item.tags.split(/\s+/);
                return tags.includes(genre);
            });
            if (filtered.length > 0) {
                startStudy(filtered, 0, Math.min(filtered.length, SMALL_GROUP_SIZE));
            }
        });
        genreButtonContainer.appendChild(btn);
    });
}

function renderDynamicLevels(data) {
    dynamicLevelContainers.innerHTML = '';
    
    LEVELS.forEach(lvl => {
        const lvlData = data.filter(item => item.level === lvl);
        if (lvlData.length === 0) return;

        const groupItem = document.createElement('div');
        groupItem.className = 'level-group-item';

        const title = document.createElement('div');
        title.className = 'level-group-title';
        title.textContent = `評価 ${lvl} (${lvlData.length}件)`;
        groupItem.appendChild(title);

        const smallGroupCount = Math.ceil(lvlData.length / SMALL_GROUP_SIZE);
        for (let j = 0; j < smallGroupCount; j++) {
            const sStart = j * SMALL_GROUP_SIZE;
            const sEnd = Math.min(lvlData.length, sStart + SMALL_GROUP_SIZE);

            const btn = document.createElement('button');
            btn.className = 'group-btn';
            btn.textContent = `${sStart + 1}～${sEnd}`;
            btn.addEventListener('click', () => {
                startStudy(lvlData, sStart, sEnd);
            });
            groupItem.appendChild(btn);
        }

        dynamicLevelContainers.appendChild(groupItem);
    });
}

function initLevelUI() {
    levelRadioContainer.innerHTML = '';
    const label0 = document.createElement('label');
    label0.className = 'level-label';
    label0.innerHTML = `<input type="radio" name="levelRadio" value="0"> 未設定`;
    levelRadioContainer.appendChild(label0);

    LEVELS.forEach(lvl => {
        const label = document.createElement('label');
        label.className = 'level-label';
        label.innerHTML = `<input type="radio" name="levelRadio" value="${lvl}"> ${lvl}`;
        levelRadioContainer.appendChild(label);
    });

    levelRadioContainer.addEventListener('change', (e) => {
        if (currentGroup.length > 0) {
            const item = currentGroup[currentIndex];
            item.level = e.target.value;
            const target = allData.find(d => d.id === item.id);
            if (target) target.level = item.level;
            saveAllData();
            renderAllMenus();
        }
    });
}

function startStudy(sourceData, startIdx, endIdx) {
    currentSourceData = sourceData;
    currentStartIdx = startIdx;
    currentEndIdx = Math.min(sourceData.length, endIdx);
    originalGroup = currentSourceData.slice(currentStartIdx, currentEndIdx);
    
    if (isShuffleMode) {
        shuffleCurrentGroup();
    } else {
        currentGroup = [...originalGroup];
    }
    
    currentIndex = 0;
    switchScreen('study');
    updateDisplay();
    if (isAlwaysShow && !isMuted) {
        speakText(currentGroup[currentIndex].en, 'en-US');
    }
}

function shuffleCurrentGroup() {
    currentGroup = [...originalGroup];
    for (let i = currentGroup.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentGroup[i], currentGroup[j]] = [currentGroup[j], currentGroup[i]];
    }
}

function updateDisplay() {
    if (currentGroup.length === 0) return;
    const item = currentGroup[currentIndex];

    // 指定通り「3/20（101～120を学習中）」の形式に修正
    counterEl.textContent = `${currentIndex + 1}/${currentGroup.length}（${currentStartIdx + 1}～${currentEndIdx}を学習中）`;

    japaneseEl.textContent = item.ja;
    englishEl.textContent = item.en;
    tagInputField.value = item.tags || "";

    japaneseEl.classList.toggle('hidden-lang', !isJapaneseVisible);

    if (isAlwaysShow) {
        isEnglishVisible = true;
        englishEl.classList.remove('hidden');
    } else {
        isEnglishVisible = false;
        englishEl.classList.add('hidden');
    }

    englishEl.classList.toggle('dimmed', isDimmed);

    const radios = levelRadioContainer.querySelectorAll('input[type="radio"]');
    radios.forEach(r => {
        r.checked = (r.value === (item.level || "0"));
    });

    prevGroupBtn.disabled = (currentStartIdx === 0);
    nextGroupBtn.disabled = (currentEndIdx >= currentSourceData.length);
}

function togglePause() {
    isPaused = !isPaused;
    pauseBtn.textContent = isPaused ? "再開" : "一時停止";
    pauseBtn.classList.toggle('paused', isPaused);
    if (!isPaused && autoPlayMode !== 0) {
        startAutoPlaySequence();
    }
}

function stopAutoPlay() {
    currentSequenceId++;
    if (autoPlayTimer) clearTimeout(autoPlayTimer);
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}

function startAutoPlaySequence() {
    stopAutoPlay();
    const seqId = currentSequenceId;

    const runStep = () => {
        if (seqId !== currentSequenceId || autoPlayMode === 0) return;
        if (isPaused) {
            autoPlayTimer = setTimeout(runStep, 200);
            return;
        }

        const item = currentGroup[currentIndex];
        if (!item) return;

        if (autoPlayMode === 1) {
            isEnglishVisible = true;
            englishEl.classList.remove('hidden');
            speakText(item.en, 'en-US', () => {
                if (seqId !== currentSequenceId) return;
                const delay = calculatePauseDelay(item.en, pauseRatioSelect.value);
                autoPlayTimer = setTimeout(() => {
                    if (seqId !== currentSequenceId) return;
                    advanceNextAutoPlay();
                }, delay);
            });
        } else if (autoPlayMode === 2) {
            isEnglishVisible = false;
            englishEl.classList.add('hidden');
            speakText(item.ja, 'ja-JP', () => {
                if (seqId !== currentSequenceId) return;
                const jaDelay = calculatePauseDelay(item.ja, jaPauseRatioSelect.value);
                autoPlayTimer = setTimeout(() => {
                    if (seqId !== currentSequenceId) return;
                    isEnglishVisible = true;
                    englishEl.classList.remove('hidden');
                    speakText(item.en, 'en-US', () => {
                        if (seqId !== currentSequenceId) return;
                        const enDelay = calculatePauseDelay(item.en, pauseRatioSelect.value);
                        autoPlayTimer = setTimeout(() => {
                            if (seqId !== currentSequenceId) return;
                            advanceNextAutoPlay();
                        }, enDelay);
                    });
                }, jaDelay);
            });
        }
    };

    runStep();
}

function advanceNextAutoPlay() {
    if (currentIndex < currentGroup.length - 1) {
        currentIndex++;
        updateDisplay();
        startAutoPlaySequence();
    } else {
        handleLoopAdvance();
    }
}

function handleLoopAdvance() {
    if (loopMode === 0) {
        currentIndex = 0;
        updateDisplay();
        if (autoPlayMode !== 0) startAutoPlaySequence();
        else if (isAlwaysShow && !isMuted) speakText(currentGroup[currentIndex].en, 'en-US');
    } else if (loopMode === 1) {
        if (currentEndIdx < currentSourceData.length) {
            const newStart = currentEndIdx;
            startStudy(currentSourceData, newStart, Math.min(currentSourceData.length, newStart + SMALL_GROUP_SIZE));
            if (autoPlayMode !== 0) startAutoPlaySequence();
        } else {
            startStudy(currentSourceData, 0, Math.min(currentSourceData.length, SMALL_GROUP_SIZE));
            if (autoPlayMode !== 0) startAutoPlaySequence();
        }
    } else {
        stopAutoPlay();
    }
}

function calculatePauseDelay(text, settingValue) {
    if (settingValue.startsWith('fixed-')) {
        const sec = parseFloat(settingValue.replace('fixed-', ''));
        return sec * 1000;
    }
    const ratio = parseFloat(settingValue);
    const estimatedSpeechSec = Math.max(1, text.length * 0.15 / speechRate);
    return estimatedSpeechSec * ratio * 1000;
}

function speakText(text, lang, onEndCallback) {
    if (isMuted || !('speechSynthesis' in window)) {
        if (onEndCallback) setTimeout(onEndCallback, 1000);
        return;
    }

    window.speechSynthesis.cancel();
    const cleanText = text.replace(/<[^>]*>/g, '');
    const uttr = new SpeechSynthesisUtterance(cleanText);
    uttr.lang = lang;
    uttr.rate = speechRate;

    let hasEnded = false;
    uttr.onend = () => {
        if (!hasEnded) {
            hasEnded = true;
            if (onEndCallback) onEndCallback();
        }
    };
    uttr.onerror = () => {
        if (!hasEnded) {
            hasEnded = true;
            if (onEndCallback) onEndCallback();
        }
    };

    window.speechSynthesis.speak(uttr);
}

function toggleFullScreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {});
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
}

function handleFileSelect(evt) {
    const file = evt.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        const content = e.target.result;
        const parsed = parseTextToData(content);
        if (parsed.length > 0) {
            allData = parsed;
            saveAllData();
            renderAllMenus();
            alert(`${parsed.length} 件のデータを読み込みました。`);
        } else {
            alert("データの読み込みに失敗したか、フォーマットが合っていません。");
        }
    };
    reader.readAsText(file);
}

function exportData() {
    let output = "";
    allData.forEach(item => {
        output += `${item.ja}◆${item.en}◆${item.level || "0"}◆${item.tags || ""}\n`;
    });

    const blob = new Blob([output], { type: 'text/plain;charset=utf-8;' });
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.setAttribute("href", url);
    link.setAttribute("download", "eikaiwa_phrases.txt");
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
</script>
